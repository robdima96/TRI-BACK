# Build, push, and deploy digimsk-study on Cloud Run (image update only — keeps env/mounts).
# Manual: gcloud builds submit --config bot/app/services/public_host/cloud_run/cloudbuild.study.yaml .
# Auto: Cloud Build trigger digimsk-study-deploy on push to main (study-related paths).

substitutions:
  _REGION: us-central1
  _REPO: digimsk
  _SERVICE: digimsk-study
  _PUBLIC_BASE_URL: https://tri-back-study-PLACEHOLDER.us-central1.run.app
  # Overridden by trigger to $COMMIT_SHA when present.
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-study
    args:
      - build
      - -f
      - bot/app/services/public_host/cloud_run/Dockerfile.study
      - --build-arg
      - PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-study-tag
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: push-study-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-study
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:${_TAG}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/digimsk-study:latest
