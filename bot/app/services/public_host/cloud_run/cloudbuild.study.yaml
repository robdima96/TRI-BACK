# Build, push, and deploy tri-back-study on Cloud Run (image update only — keeps env/mounts).
# Manual: gcloud builds submit --config bot/app/services/public_host/cloud_run/cloudbuild.study.yaml .
# Auto: Cloud Build trigger tri-back-study-deploy on push to main (study-related paths).
#
# Frontend is same-origin (no baked run.app hostname). Keep the old
# tri-back-study service until smoke tests pass.

substitutions:
  _REGION: us-central1
  _REPO: tri-back
  _SERVICE: tri-back-study
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-study
    args:
      - build
      - -f
      - bot/app/services/public_host/cloud_run/Dockerfile.study
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-study-tag
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: push-study-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-study
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:${_TAG}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:latest
