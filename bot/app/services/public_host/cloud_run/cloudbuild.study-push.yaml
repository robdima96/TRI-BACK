# Build/push tri-back-study only (no Cloud Run update).
#   gcloud builds submit --config bot/app/services/public_host/cloud_run/cloudbuild.study-push.yaml

substitutions:
  _REGION: us-central1
  _REPO: tri-back
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-study
    args:
      - build
      - -f
      - bot/app/services/public_host/cloud_run/Dockerfile.study
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-study
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/tri-back-study
