[project]
name = "tri-back"
version = "0.1.1"
description = "TRI-BACK musculoskeletal triage chatbot backend (formerly DigiMSK)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "numpy>=1.26.0",
  "torch",
  "transformers",
  "accelerate>=0.26.0",
  "chromadb>=0.5.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
# Granular extras — install subsets when you do not need the full stack.
pdf = [
  "reportlab>=4.0.0",
  "pypdf>=5.0.0",
  "fonttools>=4.0.0",
]
chunk-ingest = [
  "pypdf>=5.0.0",
  "pymupdf>=1.24.0",
]
ner = [
  "huggingface_hub>=0.20.0",
]
gliner = [
  "gliner>=0.2.0",
]
graphrag = [
  "neo4j>=5.0.0",
]
generator-api = [
  "google-cloud-aiplatform>=1.60.0",
]
# Comprehensive local/dev install: test tooling + every optional feature stack above.
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "huggingface_hub>=0.20.0",
  "gliner>=0.2.0",
  "google-cloud-aiplatform>=1.60.0",
  "reportlab>=4.0.0",
  "pypdf>=5.0.0",
  "fonttools>=4.0.0",
  "pymupdf>=1.24.0",
  "neo4j>=5.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
